# Runs ./scripts/check.sh (formatting, lint, strict types, unit tests, and
# the ECONOMY.md check) on every pull request and every push to main, with
# the tool versions pinned in rokit.toml. A red X on a commit means something
# here failed: open the run to see which job and step.
#
# Speed: the unit tests are split across 4 runners that run at the same time
# (TEST_SHARD, see tests/run.luau), and the lint/type/economy checks run in
# their own job. A newer push to a pull request cancels the older run. Runs
# on main are never cancelled. The final "checks" job is green only when
# every other job passed.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      # The render check (tools/render_touched.py) compares the pull request's preview/**/*.png with
      # the base branch: it needs the base's history, so this job fetches all of it (the tests and the
      # cloud test do not). Empty on a push to main, where the script falls back to origin/main.
      RENDER_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only the tool binaries are cached, never ~/.rokit/auth.toml (the token).
      - name: Cache Rokit tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.rokit/bin
            ~/.rokit/tool-storage
          key: rokit-v2-${{ runner.os }}-${{ hashFiles('rokit.toml') }}

      - name: Install Rokit and the pinned tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The install script reads GITHUB_PAT. Without it, five jobs starting
          # at once can hit GitHub's anonymous API limit (HTTP 403).
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -x "$HOME/.rokit/bin/rokit" ]; then
            curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          fi
          export PATH="$HOME/.rokit/bin:$PATH"
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          # The Actions token avoids GitHub's anonymous download rate limit.
          rokit authenticate github --token "$GITHUB_TOKEN" --skip-verify
          rokit install --no-trust-check

      # The Roblox type definitions, pinned in scripts/globalTypes.pin.
      - name: Cache Roblox type definitions
        uses: actions/cache@v4
        with:
          path: |
            globalTypes.d.luau
            globalTypes.d.luau.pin
          key: globaltypes-v1-${{ hashFiles('scripts/globalTypes.pin') }}

      - name: Format, lint, types, economy
        run: ./scripts/check.sh --lint-only

  tests:
    name: tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # Only the tool binaries are cached, never ~/.rokit/auth.toml (the token).
      - name: Cache Rokit tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.rokit/bin
            ~/.rokit/tool-storage
          key: rokit-v2-${{ runner.os }}-${{ hashFiles('rokit.toml') }}

      - name: Install Rokit and the pinned tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The install script reads GITHUB_PAT. Without it, five jobs starting
          # at once can hit GitHub's anonymous API limit (HTTP 403).
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -x "$HOME/.rokit/bin/rokit" ]; then
            curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          fi
          export PATH="$HOME/.rokit/bin:$PATH"
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          # The Actions token avoids GitHub's anonymous download rate limit.
          rokit authenticate github --token "$GITHUB_TOKEN" --skip-verify
          rokit install --no-trust-check

      - name: Unit tests (shard ${{ matrix.shard }} of 4)
        env:
          TEST_SHARD: ${{ matrix.shard }}/4
        run: ./scripts/check.sh --tests-only

  # The cloud test (T409): publishes a Saved version of the TEST place (never the live one) and runs the
  # town's geometry, lane, MustKeep and mesh-load checks in a Roblox Luau Execution task. One task per run,
  # one run at a time (the concurrency group). Without the ROBLOX_API_KEY secret (a fork's pull request, or
  # before the secret exists) it logs "cloud-test SKIPPED: missing ROBLOX_API_KEY" and passes as skipped,
  # never as passed; set the repository variable CLOUD_TEST_REQUIRED to 1 to make a missing key fail.
  # Require this job ("cloud-test") in branch protection once the key exists.
  cloud-test:
    name: cloud-test
    needs: [tests]
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-test
      cancel-in-progress: false
    env:
      TEST_UNIVERSE_ID: ${{ vars.TEST_UNIVERSE_ID || '10772436908' }}
      TEST_PLACE_ID: ${{ vars.TEST_PLACE_ID || '109062394774073' }}
      CLOUD_TEST_REQUIRED: ${{ vars.CLOUD_TEST_REQUIRED }}
    steps:
      - uses: actions/checkout@v4

      # Rojo only, from its pinned release (v7.7.0, the version in rokit.toml) and checked against its
      # SHA-256: this job holds ROBLOX_API_KEY, so nothing unpinned (no piped install script) runs in it.
      # The key is in the environment of the last step only.
      - name: Install Rojo 7.7.0 (pinned release, checksum checked)
        run: |
          curl -fsSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          echo "22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  rojo.zip" | sha256sum -c -
          mkdir -p "$HOME/bin"
          unzip -o rojo.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/rojo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # default.project.json plus ServerStorage.CloudTests (tests/cloud and its data); the shipping project is untouched.
      - name: Build the test place
        run: |
          python3 tools/cloud/make_project.py
          rojo build build/cloud.project.json -o build/test.rbxl

      - name: Publish the test place and run the cloud checks
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 tools/cloud/run_task.py --rbxl build/test.rbxl --script tools/cloud/task.luau

  # Single status to look at (and to require in branch protection later).
  checks:
    name: checks
    if: always()
    needs: [lint, tests, cloud-test]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          CLOUD_TEST_REQUIRED: ${{ vars.CLOUD_TEST_REQUIRED }}
        run: |
          echo "lint: ${{ needs.lint.result }}, tests: ${{ needs.tests.result }}, cloud-test: ${{ needs.cloud-test.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.tests.result }}" = success
          # cloud-test: success (it ran, or it SKIPPED for want of the key, which it reports itself). With
          # CLOUD_TEST_REQUIRED=1 only a success counts: a skipped or cancelled job is a failure.
          if [ "$CLOUD_TEST_REQUIRED" = "1" ]; then
            test "${{ needs.cloud-test.result }}" = success
          else
            test "${{ needs.cloud-test.result }}" = success || test "${{ needs.cloud-test.result }}" = skipped
          fi
