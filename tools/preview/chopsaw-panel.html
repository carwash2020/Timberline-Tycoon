<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chop saw panel</title>
<style>
  :root { --face: 48px; --gap: 8px; --read: 96px; --ink: #3c2814; --cream: #f5ebd7; --bark: #583a22; --plus: #e2b93b; }
  @media (min-width: 1000px) {
    :root { --face: 96px; --gap: 12px; --read: 160px; }
  }
  html, body { margin: 0; height: 100%; background: #7d9a62; font-family: "Trebuchet MS", sans-serif; }
  .yard { position: absolute; inset: 0; background:
    linear-gradient(#8eaf72, #6d8d58 40%, #c4b08c 40%, #b89a6e); }
  .card {
    position: absolute; left: 16px; top: 72px;
    background: var(--bark); color: var(--cream);
    border-radius: 14px; padding: 8px 10px 6px;
    box-shadow: 0 8px 18px rgba(0,0,0,.28);
  }
  .row { display: flex; gap: var(--gap); align-items: center; }
  button, .read {
    height: var(--face); border: 0; border-radius: 10px;
    font-weight: 700; font-size: 20px; color: var(--ink);
  }
  button { width: var(--face); background: #f0e1c3; }
  button.plus { background: var(--plus); outline: 3px solid #fff4c4; }
  button.wide { width: auto; padding: 0 10px; min-width: var(--face); }
  .read { width: var(--read); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .hint { margin: 8px 0 0; font-size: 16px; text-align: center; }
  .jump {
    position: absolute; right: 20px; bottom: 18px;
    width: 70px; height: 70px; border-radius: 16px;
    background: #f4f4f4; color: #222; border: 0; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="yard"></div>
  <div class="card">
    <div class="row">
      <button type="button" aria-label="shorter">−</button>
      <div class="read">8 u</div>
      <button class="plus" type="button" aria-label="longer">+</button>
      <button class="wide" type="button">Cut</button>
      <button class="wide" type="button">Close</button>
    </div>
    <p class="hint">D-pad changes the length. A cuts. B closes.</p>
  </div>
  <button class="jump" type="button">Jump</button>
</body>
</html>
