<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timberline Preview</title>
<!--
  Timberline Tycoon model preview. Written by `lune run tools/preview/export <scene>`,
  which builds the scene with the game's own art modules (outside Roblox) and
  embeds it below. Open the file in any browser: drag to orbit, right-drag to
  pan, scroll to zoom, number keys 1-9 jump to the scene's camera presets.
  It approximates Roblox's look (flat colours, sun + sky light, fog, neon glow);
  materials' textures and Roblox's exact lighting are only in Studio. A camera
  preset marked `night` shows the scene after dark (see NIGHT below).
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #9cc7e8; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; color: #fff; font-size: 12px; text-shadow: 0 1px 2px #000a; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"></div>
<script type="application/json" id="scene">/*SCENE_JSON*/</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = JSON.parse(document.getElementById("scene").textContent);
// Lua's empty tables arrive as {} rather than [].
for (const k of ["parts", "lights", "texts", "cameras", "meshes"]) if (!Array.isArray(scene[k])) scene[k] = [];
if (!scene.meshIndex || Array.isArray(scene.meshIndex)) scene.meshIndex = {};
if (!scene.meshBlobs || Array.isArray(scene.meshBlobs)) scene.meshBlobs = {};
const L = Object.assign({
  sunDir: [-0.45, 0.7, -0.35], sunColor: "#ffe2b0", sunIntensity: 2.6,
  skyTop: "#8dbbe8", skyBottom: "#f4dcae", ground: "#8a7a5c", hemiIntensity: 1.5, ambient: 0.55,
  fog: "#dfe6e6", fogNear: 250, fogFar: 1400, exposure: 1.0, bloom: 0.3,
}, scene.lighting || {});
// bloom 0.3 (was 0.55): Neon glows without melting its part into a white
// blob, so the Starfall axe keeps its shape (ACT-15). A scene may set its own.

// The night preset (WLD-19). A camera with `night: true` renders with these
// over the scene's lighting; the other keys (sunDir, ground, fog distances,
// exposure, bloom) stay the scene's. At night the parts the game lights after
// dark (WindowGlass, LampGlow, LanternGlow: export.luau tags them) glow Neon,
// and the point lights drawn are the 24 nearest the camera (see useLights).
// Cameras without the flag render exactly as before.
const NIGHT = Object.assign({}, L, {
  sunColor: "#7f8fc8", sunIntensity: 0.35, skyTop: "#0a1030", skyBottom: "#273256",
  ambient: 0.18, hemiIntensity: 0.45, fog: "#1b2140",
});
const NIGHT_ENV = 0.25; // metals reflect a quarter as much of the room at night

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = L.exposure;
document.body.appendChild(renderer.domElement);

const world = new THREE.Scene();
world.fog = new THREE.Fog(L.fog, L.fogNear, L.fogFar);
// A soft studio room for metals to reflect (see METALS below).
const ENV = (() => {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const room = new RoomEnvironment();
  const texture = pmrem.fromScene(room, 0.04).texture;
  room.dispose();
  pmrem.dispose();
  return texture;
})();

// Sky: a big gradient dome.
const sky = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(L.skyTop) }, bottom: { value: new THREE.Color(L.skyBottom) } },
  vertexShader: "varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
  fragmentShader: "uniform vec3 top; uniform vec3 bottom; varying vec3 p; void main(){ float t = clamp(p.y*1.6+0.15,0.0,1.0); gl_FragColor = vec4(mix(bottom, top, t),1.0); }",
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(6000, 32, 16), sky);
world.add(skyDome);
if (scene.background) {
  world.background = new THREE.Color(scene.background);
  skyDome.visible = false;
  world.fog.near = 8000;
  world.fog.far = 16000;
  world.fog.color.set(scene.background);
}

// Roblox's OutdoorAmbient keeps shadows readable; a hemisphere light plus a
// little flat ambient is the closest cheap match.
const hemi = new THREE.HemisphereLight(L.skyTop, L.ground, L.hemiIntensity);
const ambient = new THREE.AmbientLight("#ffffff", L.ambient);
world.add(hemi, ambient);
const sun = new THREE.DirectionalLight(L.sunColor, L.sunIntensity);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
world.add(sun, sun.target);

// ---- Geometry for each Roblox shape (unit size, centred) -------------------
function wedgeGeometry() {
  // Roblox WedgePart: full bottom and back (+Z) faces, slope from the top of
  // the back edge down to the bottom of the front (-Z) edge.
  const a = [-.5,-.5,-.5], b = [.5,-.5,-.5], c = [.5,-.5,.5], d = [-.5,-.5,.5], e = [-.5,.5,.5], f = [.5,.5,.5];
  // Counter-clockwise from outside, so each face's normal points out (the
  // old order lit every wedge's slope as if it faced away from the sun).
  const tris = [a,b,c, a,c,d, d,c,f, d,f,e, a,f,b, a,e,f, a,d,e, b,f,c];
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(tris.flat(), 3));
  g.computeVertexNormals();
  return g;
}
function cornerWedgeGeometry() {
  // Approximation (peak over the +X, -Z top corner); avoid in art code.
  const a = [-.5,-.5,-.5], b = [.5,-.5,-.5], c = [.5,-.5,.5], d = [-.5,-.5,.5], p = [.5,.5,-.5];
  const tris = [a,c,b, a,d,c, a,b,p, b,c,p, c,d,p, d,a,p];
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(tris.flat(), 3));
  g.computeVertexNormals();
  return g;
}
const GEOM = {
  Block: new THREE.BoxGeometry(1, 1, 1),
  Wedge: wedgeGeometry(),
  CornerWedge: cornerWedgeGeometry(),
  Cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 20).rotateZ(Math.PI / 2), // Roblox cylinders run along X
  Ball: new THREE.SphereGeometry(0.5, 20, 14),
  Sphere: new THREE.SphereGeometry(0.5, 20, 14), // SpecialMesh sphere (an ellipsoid)
};

// Roblox materials, roughly: [roughness, metalness]. A three.js metal keeps
// little of its own colour and shows what it reflects, so with nothing to
// reflect Silver read grey and Gold brown (ACT-15). Metals stay at 0.5
// metalness or under and reflect ENV; nothing else gets ENV, so wood,
// plastic, glass and terrain look as they always did.
const METALS = new Set(["Metal", "DiamondPlate", "CorrodedMetal", "Foil"]);
const ENV_INTENSITY = 0.6;
const MAT = {
  Metal: [0.45, 0.5], DiamondPlate: [0.4, 0.5], CorrodedMetal: [0.8, 0.4], Foil: [0.3, 0.5],
  Glass: [0.05, 0.1], Ice: [0.15, 0.0], Glacier: [0.2, 0.0], Marble: [0.35, 0.0], SmoothPlastic: [0.6, 0.0], Plastic: [0.65, 0.0],
};

// Group parts into InstancedMeshes by shape + material class + transparency.
// A part the game lights at night (it carries a night colour, p[19]) also
// goes into a Neon night group, and its day look into a group of its own, so
// a night camera can swap the two (setView).
const groups = new Map(), nightGroups = new Map();
const m4 = new THREE.Matrix4(), s4 = new THREE.Matrix4(), col = new THREE.Color();
const bounds = new THREE.Box3();
const SHAPES = scene.shapes;
const MATS = scene.materials;
function addTo(map, key, make, p) {
  let g = map.get(key);
  if (!g) { g = Object.assign(make(), { items: [] }); map.set(key, g); }
  g.items.push(p);
}
for (const p of scene.parts) {
  // [shape, sx,sy,sz, x,y,z, r00..r22, color, material, transparency, nightColor?]
  const shape = SHAPES[p[0]];
  const material = MATS[p[17]];
  const transparency = p[18];
  if (transparency >= 0.98) continue;
  const neon = material === "Neon";
  const glow = typeof p[19] === "string";
  const key = shape + "|" + (neon ? "neon" : (MAT[material] ? material : "default")) + "|" + transparency.toFixed(2) + (glow ? "|glow" : "");
  addTo(groups, key, () => ({ shape, material: neon ? "Neon" : material, transparency, glow }), p);
  if (glow) addTo(nightGroups, shape + "|" + transparency.toFixed(2), () => ({ shape, material: "Neon", transparency, night: true }), p);
}
const metalMaterials = [], dayGlowMeshes = [], nightGlowMeshes = [];
function buildMesh(g) {
  const [rough, metal] = MAT[g.material] || [0.85, 0.0];
  let mat;
  if (g.material === "Neon") {
    mat = new THREE.MeshBasicMaterial({ toneMapped: false });
  } else {
    // Boxes and wedges already have one normal per face; flatShading would
    // flip double-sided faces wound the other way.
    mat = new THREE.MeshStandardMaterial({ roughness: rough, metalness: metal });
    if (METALS.has(g.material)) { mat.envMap = ENV; mat.envMapIntensity = ENV_INTENSITY; metalMaterials.push(mat); }
  }
  if (g.transparency > 0 || g.material === "Glass") {
    mat.transparent = true;
    mat.opacity = Math.max(0.15, 1 - g.transparency - (g.material === "Glass" ? 0.35 : 0));
    mat.depthWrite = g.transparency < 0.5;
  }
  mat.side = THREE.DoubleSide;
  const mesh = new THREE.InstancedMesh(GEOM[g.shape] || GEOM.Block, mat, g.items.length);
  g.items.forEach((p, i) => {
    let sx = p[1], sy = p[2], sz = p[3];
    if (g.shape === "Ball") { const d = Math.min(sx, sy, sz); sx = sy = sz = d; }
    if (g.shape === "Cylinder") { const d = Math.min(sy, sz); sy = sz = d; }
    m4.set(p[7], p[8], p[9], p[4], p[10], p[11], p[12], p[5], p[13], p[14], p[15], p[6], 0, 0, 0, 1);
    s4.makeScale(Math.max(sx, 0.01), Math.max(sy, 0.01), Math.max(sz, 0.01));
    m4.multiply(s4);
    mesh.setMatrixAt(i, m4);
    col.set("#" + (g.night ? p[19] : p[16]));
    if (g.material === "Neon") col.multiplyScalar(1.6);
    mesh.setColorAt(i, col);
    bounds.expandByPoint(new THREE.Vector3(p[4], p[5], p[6]));
  });
  mesh.castShadow = g.material !== "Neon" && g.transparency < 0.5;
  mesh.receiveShadow = true;
  world.add(mesh);
  return mesh;
}
for (const g of groups.values()) {
  const mesh = buildMesh(g);
  if (g.glow) dayGlowMeshes.push(mesh);
}
for (const g of nightGroups.values()) {
  const mesh = buildMesh(g);
  mesh.visible = false;
  nightGlowMeshes.push(mesh);
}

// Point lights (the brightest few: forward rendering can't afford hundreds).
// [x, y, z, color, range, brightness, nightOnly?]. A day camera draws the
// first 24 in export order, leaving out the night-only ones (a light in a
// night part that was built switched off). A night camera has every light on,
// as the game does after dark, and draws the 24 nearest the camera preset's
// position (orbiting away from it doesn't pick again; press its key).
const MAX_LIGHTS = 24;
const pointLights = [];
for (let i = 0; i < Math.min(MAX_LIGHTS, scene.lights.length); i++) {
  const pl = new THREE.PointLight("#ffffff", 0, 0, 1.6);
  world.add(pl);
  pointLights.push(pl);
}
function useLights(night, at) {
  let list = scene.lights.filter((l) => night || !l[6]);
  if (night) {
    const d2 = (l) => (l[0] - at.x) ** 2 + (l[1] - at.y) ** 2 + (l[2] - at.z) ** 2;
    list = list.map((l) => [d2(l), l]).sort((a, b) => a[0] - b[0]).map((e) => e[1]);
  }
  pointLights.forEach((pl, i) => {
    const l = list[i];
    if (!l) { pl.intensity = 0; return; }
    pl.color.set("#" + l[3]);
    pl.intensity = l[5] * 6;
    pl.distance = l[4] * 1.4;
    pl.position.set(l[0], l[1], l[2]);
  });
}

// Text on SurfaceGuis (signs) and BillboardGuis (name tags).
// The canvas matches the face, and words wrap. fillText's maxWidth argument
// squashes glyphs sideways, so it is not used.
function wrapLines(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split("\n")) {
    const words = para.split(/\s+/).filter(Boolean);
    if (!words.length) { out.push(""); continue; }
    let line = words[0];
    for (let i = 1; i < words.length; i++) {
      const trial = line + " " + words[i];
      if (ctx.measureText(trial).width <= maxW) line = trial;
      else { out.push(line); line = words[i]; }
    }
    out.push(line);
  }
  return out;
}
function textTexture(text, color, bg, planeW, planeH) {
  const aspect = Math.max(planeW, 0.05) / Math.max(planeH, 0.05);
  let ch = 512;
  let cw = Math.round(ch * aspect);
  if (cw > 2048) { cw = 2048; ch = Math.max(64, Math.round(cw / aspect)); }
  if (cw < 64) { cw = 64; ch = Math.max(64, Math.round(cw / aspect)); }
  const c = document.createElement("canvas"); c.width = cw; c.height = ch;
  const x = c.getContext("2d");
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, cw, ch); }
  x.fillStyle = color; x.textAlign = "center"; x.textBaseline = "middle";
  const maxW = cw * 0.88;
  const maxH = ch * 0.88;
  let lo = 8, hi = Math.max(8, Math.floor(maxH)), best = 12, bestLines = [String(text)];
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    x.font = `bold ${mid}px system-ui, sans-serif`;
    const lines = wrapLines(x, text, maxW);
    const tooWide = lines.some((ln) => x.measureText(ln).width > maxW + 1);
    if (!tooWide && lines.length * mid * 1.15 <= maxH) { best = mid; bestLines = lines; lo = mid + 1; }
    else hi = mid - 1;
  }
  x.font = `bold ${best}px system-ui, sans-serif`;
  const step = best * 1.15;
  const top = ch / 2 - ((bestLines.length - 1) * step) / 2;
  bestLines.forEach((ln, i) => x.fillText(ln, cw / 2, top + i * step));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
for (const t of (scene.texts || [])) {
  // [kind, w, h, x,y,z, r00..r22, text, color]
  const geom = new THREE.PlaneGeometry(t[1], t[2]);
  const mat = new THREE.MeshBasicMaterial({ map: textTexture(t[15], "#" + t[16], null, t[1], t[2]), transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const mesh = new THREE.Mesh(geom, mat);
  m4.set(t[6], t[7], t[8], t[3], t[9], t[10], t[11], t[4], t[12], t[13], t[14], t[5], 0, 0, 0, 1);
  mesh.applyMatrix4(m4);
  if (t[0] === "billboard") mesh.userData.billboard = true;
  world.add(mesh);
}

// Terrain heightfield (+ water) when the scene has one.
if (scene.terrain) {
  const T = scene.terrain;
  const g = new THREE.PlaneGeometry((T.nx - 1) * T.step, (T.nz - 1) * T.step, T.nx - 1, T.nz - 1);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  for (let iz = 0; iz < T.nz; iz++) for (let ix = 0; ix < T.nx; ix++) {
    const i = iz * T.nx + ix;
    pos.setXYZ(i, T.x0 + ix * T.step, T.h[i], T.z0 + iz * T.step);
    col.set("#" + T.palette[T.m[i]]);
    colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
  }
  g.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true }));
  mesh.receiveShadow = true;
  world.add(mesh);
  bounds.expandByPoint(new THREE.Vector3(T.x0, 0, T.z0));
  bounds.expandByPoint(new THREE.Vector3(T.x0 + (T.nx - 1) * T.step, 0, T.z0 + (T.nz - 1) * T.step));
  if (T.wet) {
    // Water only over the columns that have it: one quad per wet cell.
    const verts = [];
    for (let iz = 0; iz < T.nz - 1; iz++) for (let ix = 0; ix < T.nx - 1; ix++) {
      const i = iz * T.nx + ix;
      const w = Math.max(T.wet[i], T.wet[i + 1], T.wet[i + T.nx], T.wet[i + T.nx + 1]);
      if (w < -9000) continue;
      const x0 = T.x0 + ix * T.step, z0 = T.z0 + iz * T.step, x1 = x0 + T.step, z1 = z0 + T.step;
      verts.push(x0, w, z0, x1, w, z0, x1, w, z1, x0, w, z0, x1, w, z1, x0, w, z1);
    }
    if (verts.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
      g.computeVertexNormals();
      world.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: T.waterColor || "#3d8fb8", transparent: true, opacity: 0.85, roughness: 0.12, metalness: 0.1, side: THREE.DoubleSide })));
    }
  }
}

// Custom meshes (MeshPart / FileMesh). The export embeds the GLB bytes
// because a file:// page cannot fetch them. Each id is one node from
// assets/meshes/manifest.json. The node is centred on its bounds and scaled
// so that box matches the part Size, which is what a MeshPart does with
// initialSize. A missing id or a GLB that fails to parse is a magenta box
// labelled MISSING MESH. Nothing falls back to a part-built stand-in.
const gltfLoader = new GLTFLoader();
const gltfCache = new Map();
function b64ToBuffer(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
function paintMaterials(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (!m) continue;
      // VC_Paint has vertex colours and no metal/rough factors. glTF's
      // default metalness is 1, which would draw those colours as black.
      if (m.name === "VC_Paint") { m.metalness = 0; m.roughness = 0.72; }
      m.side = THREE.DoubleSide;
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });
}
function gltfFor(file) {
  if (!gltfCache.has(file)) {
    const b64 = scene.meshBlobs[file];
    if (!b64) {
      gltfCache.set(file, Promise.reject(new Error("no bytes for " + file)));
    } else {
      const url = URL.createObjectURL(new Blob([b64ToBuffer(b64)], { type: "model/gltf-binary" }));
      gltfCache.set(file, gltfLoader.loadAsync(url).then((gltf) => {
        URL.revokeObjectURL(url);
        paintMaterials(gltf.scene);
        return gltf;
      }).catch((err) => { URL.revokeObjectURL(url); throw err; }));
    }
  }
  return gltfCache.get(file);
}
function nodeNamed(gltf, name) {
  let hit = null;
  gltf.scene.traverse((o) => { if (!hit && o.name === name) hit = o; });
  return hit;
}
function cframeMatrix(p) {
  const m = new THREE.Matrix4();
  m.set(p[7], p[8], p[9], p[4], p[10], p[11], p[12], p[5], p[13], p[14], p[15], p[6], 0, 0, 0, 1);
  return m;
}
function missingMesh(id, p) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xff00ff })));
  const w = Math.max(p[1], 1.2);
  const plate = new THREE.Mesh(
    new THREE.PlaneGeometry(w, Math.max(0.4, w * 0.22)),
    new THREE.MeshBasicMaterial({ map: textTexture("MISSING MESH " + id, "#ffffff", "#ff00ff"), side: THREE.DoubleSide })
  );
  plate.position.y = 0.72;
  g.add(plate);
  const wrap = new THREE.Group();
  wrap.add(g);
  wrap.scale.set(Math.max(p[1], 0.05), Math.max(p[2], 0.05), Math.max(p[3], 0.05));
  const placed = new THREE.Group();
  placed.matrixAutoUpdate = false;
  placed.matrix.copy(cframeMatrix(p));
  placed.add(wrap);
  world.add(placed);
  bounds.expandByPoint(new THREE.Vector3(p[4], p[5], p[6]));
}
function fittedNode(node, sx, sy, sz) {
  const clone = node.clone(true);
  clone.position.set(0, 0, 0);
  clone.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(clone);
  if (box.isEmpty()) return null;
  const size = box.getSize(new THREE.Vector3());
  clone.position.sub(box.getCenter(new THREE.Vector3()));
  const holder = new THREE.Group();
  holder.add(clone);
  holder.scale.set(sx / Math.max(size.x, 1e-4), sy / Math.max(size.y, 1e-4), sz / Math.max(size.z, 1e-4));
  return holder;
}
async function addMeshes() {
  const pending = new Map();
  for (const p of scene.meshes) {
    if (p[17] >= 0.98) continue;
    const info = scene.meshIndex[String(p[0])];
    if (!info || !info.file) continue;
    if (!pending.has(info.file)) pending.set(info.file, gltfFor(info.file));
  }
  await Promise.allSettled([...pending.values()]);
  for (const p of scene.meshes) {
    if (p[17] >= 0.98) continue;
    const id = p[0];
    const info = scene.meshIndex[String(id)];
    let placedNode = null;
    if (info && info.file && pending.get(info.file)) {
      try {
        const gltf = await pending.get(info.file);
        const node = nodeNamed(gltf, info.node);
        if (node) placedNode = fittedNode(node, Math.max(p[1], 0.01), Math.max(p[2], 0.01), Math.max(p[3], 0.01));
      } catch (err) {
        console.error("mesh", id, err);
      }
    }
    if (!placedNode) { missingMesh(id, p); continue; }
    const placed = new THREE.Group();
    placed.matrixAutoUpdate = false;
    placed.matrix.copy(cframeMatrix(p));
    placed.add(placedNode);
    world.add(placed);
    bounds.expandByPoint(new THREE.Vector3(p[4], p[5], p[6]));
  }
}

// Fit the shadow camera to the scene.
const size = bounds.getSize(new THREE.Vector3());
const center = bounds.getCenter(new THREE.Vector3());
const radius = Math.max(20, size.length() / 2);
const sd = new THREE.Vector3(...L.sunDir).normalize();
const shadowRadius = Math.min(radius, scene.shadowRadius || 400);
sun.target.position.copy(center);
sun.position.copy(center).addScaledVector(sd, shadowRadius * 2);
Object.assign(sun.shadow.camera, { left: -shadowRadius, right: shadowRadius, top: shadowRadius, bottom: -shadowRadius, near: 1, far: shadowRadius * 5 });
sun.shadow.camera.updateProjectionMatrix();

// Camera + controls.
const camera = new THREE.PerspectiveCamera(scene.fov || 55, innerWidth / innerHeight, 0.5, 12000);
const controls = new OrbitControls(camera, renderer.domElement);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(world, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), L.bloom, 0.6, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// The scene's own lighting, or the night preset (NIGHT, at the top).
function useLighting(night) {
  const X = night ? NIGHT : L;
  sky.uniforms.top.value.set(X.skyTop);
  sky.uniforms.bottom.value.set(X.skyBottom);
  hemi.color.set(X.skyTop);
  hemi.groundColor.set(X.ground);
  hemi.intensity = X.hemiIntensity;
  ambient.intensity = X.ambient;
  sun.color.set(X.sunColor);
  sun.intensity = X.sunIntensity;
  world.fog.color.set(X.fog);
  bloom.strength = X.bloom;
  for (const m of metalMaterials) m.envMapIntensity = ENV_INTENSITY * (night ? NIGHT_ENV : 1);
  for (const m of dayGlowMeshes) m.visible = !night;
  for (const m of nightGlowMeshes) m.visible = night;
}

// Camera presets: { pos, target, label?, fov?, night? } (export.luau has the
// format). `night: true` renders that view with the night preset.
const views = scene.cameras && scene.cameras.length ? scene.cameras : [{ pos: [center.x + radius, center.y + radius * 0.6, center.z + radius], target: [center.x, center.y, center.z] }];
function setView(i) {
  const v = views[Math.max(0, Math.min(views.length - 1, i))];
  const night = v.night === true;
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  camera.fov = v.fov || scene.fov || 55;
  camera.updateProjectionMatrix();
  controls.update();
  useLighting(night);
  useLights(night, camera.position);
  const hud = document.getElementById("hud");
  if (scene.hud === false) hud.style.display = "none";
  hud.textContent = `${scene.name} · view ${i + 1}/${views.length}${v.label ? " · " + v.label : ""}${night ? " · night" : ""} · ${scene.parts.length} parts`;
}
window.setView = setView;
window.viewCount = views.length;
addEventListener("keydown", (e) => { const n = parseInt(e.key, 10); if (n >= 1 && n <= 9) setView(n - 1); });
setView(0);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
function frame() {
  world.traverse((o) => { if (o.userData.billboard) o.quaternion.copy(camera.quaternion); });
  controls.update();
  composer.render();
  requestAnimationFrame(frame);
}
frame();
await addMeshes();
window.__ready = true;
</script>
</body>
</html>
